<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>咪咪捕捉计划 V4 · 猫猫研究所</title>

<style>
:root{
  --bg1:#fff7ef;
  --bg2:#ffe7d8;
  --ink:#251d19;
  --muted:#7a6b63;
  --accent:#ff7b59;
  --accent2:#ffb26b;
  --glass:rgba(255,255,255,.82);
  --line:rgba(255,255,255,.92);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  height:100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    sans-serif;

  color:var(--ink);
}

body{
  overflow:hidden;

  background:
    radial-gradient(
      circle at 18% 8%,
      rgba(255,255,255,.96),
      transparent 25%
    ),

    radial-gradient(
      circle at 90% 8%,
      rgba(255,255,255,.82),
      transparent 18%
    ),

    linear-gradient(
      160deg,
      var(--bg1),
      var(--bg2)
    );
}

button{
  font:inherit;
}

#app{
  height:100%;

  display:flex;
  flex-direction:column;

  gap:8px;

  padding:
    max(env(safe-area-inset-top),10px)
    12px
    max(env(safe-area-inset-bottom),8px);
}

header{
  display:grid;

  grid-template-columns:
    1fr auto;

  gap:10px;

  align-items:center;
}

.title{
  font-size:21px;
  font-weight:950;
  letter-spacing:.1px;
}

.sub{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.stats{
  display:grid;

  grid-template-columns:
    auto auto;

  gap:6px;
}

.pill{
  min-width:74px;

  padding:
    8px 10px;

  text-align:center;

  font-weight:900;

  background:
    var(--glass);

  border:
    1px solid var(--line);

  border-radius:
    18px;

  box-shadow:
    0 8px 24px rgba(110,67,42,.08);

  backdrop-filter:
    blur(10px);
}

.pill small{
  display:block;

  font-size:10px;

  color:
    var(--muted);

  font-weight:
    700;

  margin-bottom:
    1px;
}

.toprow{
  display:flex;

  gap:8px;

  align-items:center;

  min-height:
    36px;
}

.combo{
  flex:1;

  position:relative;

  overflow:hidden;

  padding:
    8px 10px;

  border-radius:
    16px;

  background:
    rgba(255,255,255,.58);

  border:
    1px solid rgba(255,255,255,.82);

  font-size:
    12px;

  font-weight:
    850;
}

.combo .fill{
  position:absolute;

  inset:
    0 auto 0 0;

  width:
    0%;

  background:
    linear-gradient(
      90deg,
      rgba(255,123,89,.16),
      rgba(255,187,107,.28)
    );

  transition:
    width .12s linear;
}

.combo span{
  position:relative;

  z-index:
    1;
}

.record{
  font-size:
    12px;

  color:
    var(--muted);

  font-weight:
    850;

  white-space:
    nowrap;
}

#mission{
  display:flex;

  align-items:center;

  gap:8px;

  min-height:
    42px;

  padding:
    8px 10px;

  border-radius:
    16px;

  background:
    rgba(255,255,255,.62);

  border:
    1px solid rgba(255,255,255,.82);

  font-size:
    12px;

  font-weight:
    800;
}

#mission .icon{
  font-size:
    18px;
}

#mission .text{
  flex:1;
}

#mission .progress{
  color:
    var(--accent);

  font-weight:
    950;

  white-space:
    nowrap;
}

#arena{
  position:relative;

  flex:1;

  min-height:0;

  overflow:hidden;

  border-radius:
    28px;

  border:
    1px solid rgba(255,255,255,.94);

  box-shadow:
    0 18px 55px rgba(103,61,36,.13);

  background:
    linear-gradient(
      rgba(255,255,255,.28),
      rgba(255,255,255,.12)
    ),

    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.15) 0 1px,
      transparent 1px 46px
    ),

    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.11) 0 1px,
      transparent 1px 46px
    );
}

#arena.fever{
  animation:
    feverPulse .8s ease-in-out infinite alternate;
}

@keyframes feverPulse{

  from{
    box-shadow:
      0 18px 55px rgba(103,61,36,.13);
  }

  to{
    box-shadow:
      0 18px 70px rgba(255,122,89,.28),
      inset 0 0 0 2px rgba(255,157,86,.18);
  }

}

.target{
  position:absolute;

  width:78px;
  height:78px;

  border-radius:
    24px;

  display:grid;

  place-items:center;

  transform:
    translate(-50%,-50%)
    scale(.46);

  opacity:0;

  user-select:none;

  cursor:pointer;

  border:
    1px solid rgba(255,255,255,.95);

  background:
    rgba(255,255,255,.9);

  box-shadow:
    0 12px 28px rgba(81,48,31,.16);

  animation:
    pop .17s ease-out forwards;

  will-change:
    transform,
    left,
    top;
}

.target .emoji{
  font-size:
    38px;

  line-height:
    1;
}

.target .tag{
  position:absolute;

  bottom:-9px;

  left:50%;

  transform:
    translateX(-50%);

  font-size:
    10px;

  font-weight:
    900;

  background:
    rgba(42,33,29,.86);

  color:#fff;

  padding:
    3px 7px;

  border-radius:
    999px;

  white-space:
    nowrap;
}

.target.rare{
  width:86px;
  height:86px;

  background:
    linear-gradient(
      145deg,
      #fff9e5,
      #ffdc92
    );

  box-shadow:
    0 0 0 3px rgba(255,197,78,.24),
    0 12px 30px rgba(148,93,24,.20);
}

.target.legend{
  width:92px;
  height:92px;

  background:
    linear-gradient(
      145deg,
      #fff4d5,
      #ffc86d
    );

  box-shadow:
    0 0 0 4px rgba(255,183,44,.25),
    0 14px 34px rgba(121,72,23,.22);
}

.target.legend .emoji{
  font-size:
    44px;
}

.target.bad{
  background:
    linear-gradient(
      145deg,
      #eef4ff,
      #dce8ff
    );
}

.target.fake{
  background:
    linear-gradient(
      145deg,
      #f6f6f6,
      #e5e5e5
    );
}

.target.power{
  background:
    linear-gradient(
      145deg,
      #fff0f7,
      #ffd7ea
    );
}

.target.boss{
  width:108px;
  height:108px;

  border-radius:
    30px;

  background:
    linear-gradient(
      145deg,
      #fff2c7,
      #ffcc67
    );

  box-shadow:
    0 0 0 4px rgba(255,184,45,.28),
    0 16px 38px rgba(121,72,23,.23);
}

.target.boss .emoji{
  font-size:
    50px;
}

.target.shy .tag{
  background:
    rgba(85,68,58,.9);
}

.hp{
  position:absolute;

  top:-11px;

  left:50%;

  transform:
    translateX(-50%);

  font-size:
    11px;

  font-weight:
    950;

  background:
    #2a211d;

  color:#fff;

  padding:
    4px 8px;

  border-radius:
    999px;

  white-space:
    nowrap;
}

@keyframes pop{

  to{
    transform:
      translate(-50%,-50%)
      scale(1);

    opacity:1;
  }

}

@keyframes hit{

  45%{
    transform:
      translate(-50%,-50%)
      scale(1.17)
      rotate(-6deg);
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(.1);

    opacity:0;
  }

}

@keyframes bump{

  50%{
    transform:
      translate(-50%,-50%)
      scale(1.08);
  }

}

.float{
  position:absolute;

  transform:
    translate(-50%,-50%);

  font-size:
    17px;

  font-weight:
    950;

  pointer-events:none;

  z-index:4;

  animation:
    floatUp .7s ease-out forwards;

  text-shadow:
    0 2px 0 rgba(255,255,255,.95);
}

@keyframes floatUp{

  to{
    transform:
      translate(-50%,-115px)
      scale(1.08);

    opacity:0;
  }

}

#toast{
  position:absolute;

  z-index:7;

  left:50%;

  top:15px;

  transform:
    translateX(-50%);

  max-width:90%;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  background:
    rgba(37,29,25,.88);

  color:white;

  padding:
    9px 13px;

  border-radius:
    999px;

  font-size:
    12px;

  font-weight:
    900;

  opacity:0;

  transition:.18s;
}

#toast.show{
  opacity:1;
}

#eventBanner{
  position:absolute;

  z-index:6;

  left:50%;

  top:58px;

  transform:
    translateX(-50%)
    translateY(-10px);

  opacity:0;

  transition:.2s;

  background:
    rgba(255,245,218,.94);

  border:
    1px solid rgba(255,213,124,.95);

  box-shadow:
    0 10px 28px rgba(139,91,28,.12);

  padding:
    8px 12px;

  border-radius:
    999px;

  font-size:
    12px;

  font-weight:
    950;

  white-space:
    nowrap;
}

#eventBanner.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

#overlay{
  position:absolute;

  inset:0;

  display:grid;

  place-items:center;

  padding:20px;

  z-index:10;

  background:
    linear-gradient(
      rgba(255,247,239,.26),
      rgba(255,235,219,.44)
    );

  backdrop-filter:
    blur(5px);
}

.panel{
  width:
    min(95%,450px);

  max-height:
    92%;

  overflow:auto;

  text-align:center;

  background:
    rgba(255,255,255,.92);

  border:
    1px solid white;

  border-radius:
    30px;

  padding:
    24px 22px;

  box-shadow:
    0 20px 60px rgba(109,69,43,.17);
}

.hero{
  font-size:
    64px;

  line-height:
    1;
}

.panel h1{
  font-size:
    24px;

  margin:
    11px 0 6px;
}

.panel p{
  font-size:
    14px;

  line-height:
    1.6;

  color:
    var(--muted);

  margin:
    0 auto 14px;

  max-width:
    340px;
}

.menuBtns{
  display:grid;

  gap:9px;

  margin-top:
    16px;
}

.btn{
  border:0;

  border-radius:
    18px;

  padding:
    13px 20px;

  font-size:
    15px;

  font-weight:
    950;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  box-shadow:
    0 11px 25px rgba(255,122,89,.24);
}

.btn.secondary{
  color:
    var(--ink);

  background:
    #fff4e9;

  box-shadow:none;

  border:
    1px solid #ffe1c9;
}

.btn.ghost{
  color:
    var(--muted);

  background:
    transparent;

  box-shadow:none;

  border:
    1px solid #eadfd6;
}

.grid2{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin:
    12px 0 16px;

  text-align:left;
}

.infoCard{
  border-radius:
    16px;

  background:
    rgba(255,245,236,.78);

  padding:
    10px 11px;

  font-size:
    12px;

  line-height:
    1.45;

  font-weight:
    760;
}

.catbook{
  display:grid;

  gap:9px;

  text-align:left;

  margin:
    12px 0;
}

.catcard{
  display:grid;

  grid-template-columns:
    50px 1fr auto;

  align-items:center;

  gap:10px;

  padding:
    10px 11px;

  border-radius:
    17px;

  background:
    #fff8f1;

  border:
    1px solid #ffe7d3;
}

.catcard.locked{
  opacity:.48;

  filter:
    grayscale(.35);
}

.catface{
  font-size:
    34px;

  text-align:center;
}

.catname{
  font-weight:
    950;

  font-size:
    14px;
}

.catmeta{
  font-size:
    11px;

  color:
    var(--muted);

  margin-top:
    2px;
}

.count{
  font-size:
    12px;

  font-weight:
    950;

  color:
    var(--accent);
}

.records{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin:
    14px 0;
}

.rec{
  background:
    #fff8f1;

  border:
    1px solid #ffe7d3;

  border-radius:
    17px;

  padding:
    13px 10px;
}

.rec strong{
  display:block;

  font-size:
    21px;
}

.rec span{
  font-size:
    11px;

  color:
    var(--muted);
}

.summary{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin:
    13px 0;
}

.sum{
  background:
    #fff8f1;

  border:
    1px solid #ffe7d3;

  border-radius:
    16px;

  padding:
    10px;
}

.sum b{
  display:block;

  font-size:
    17px;
}

.sum span{
  font-size:
    11px;

  color:
    var(--muted);
}

.shake{
  animation:
    shake .22s linear;
}

@keyframes shake{

  25%{
    transform:
      translateX(-4px);
  }

  50%{
    transform:
      translateX(4px);
  }

  75%{
    transform:
      translateX(-3px);
  }

}

footer{
  text-align:center;

  font-size:
    11px;

  color:
    var(--muted);

  padding-top:
    1px;
}

@media (max-height:700px){

  .panel{
    padding:
      18px 18px;
  }

  .hero{
    font-size:
      52px;
  }

  .title{
    font-size:

  }

  .sub{
    font-size:
      11px;
  }

  #mission{
    min-height:
      36px;

    padding:
      6px 9px;
  }

}
</style>
</head>

<body>

<div id="app">

<header>

  <div>

    <div class="title">

<script>

(() => {

const $ =
  id =>

const arena =

const scoreEl =

const timeEl =

const highScoreEl =

const overlay =

const panel =
  $('panel');


const missionText =

const missionProgress =
  $('missionProgress');



const STORAGE_KEY =
  'catLabV4State';



const defaultState = {

  highScore:0,

  games:0,

  totalCaught:0,

  bestCombo:0,

  bosses:0,

  missions:0,

  collection:{

    unknown:0
  }

};



let state =
  loadState();


highScoreEl.textContent =
  state.highScore;



const cats = {

  normal:{
    emoji:'🐈',

  },


  black:{

    points:2,
    speed:.085,
    life:4000,

  },


  aby:{

  },


  sand:{

    speed:.11,
    life:3600,

  },


  rusty:{

  },

    speed:.08,

    fake:true
  },


  heart:{
    emoji:'💗',
    name:'摸摸券',
    points:0,
    speed:.06,
    life:3200,
    power:true
  }

};



const bosses = [

  {
    emoji:'👑🐈‍⬛',
    name:'黑咪王',
    hp:3,
    points:12,
    speed:.055
  },

  {
    emoji:'👑🏜️🐈',
    name:'巨型沙丘猫',
    hp:2,
    points:14,
    speed:.045
  },

  {
    emoji:'👑🐆',
    name:'暴躁豹纹王',
    hp:3,
    points:16,
    speed:.065
  }

];



const missions = [

  {
    id:'sand2',
    text:'抓到 2 只沙丘猫',
    target:2,
    reward:10
  },

  {
    id:'rare3',
    text:'抓到 3 只稀有猫',
    target:3,
    reward:10
  },

  {
    id:'combo8',
    text:'达到 8 连击',
    target:8,
    reward:10
  },

  {
    id:'catch18',
    text:'本局抓到 18 只猫',
    target:18,
    reward:10
  },

  {
    id:'boss',
    text:'击败本局 Boss',
    target:1,
    reward:12
  },

  {
    id:'clean',
    text:'整局不要点错机器人或狗',
    target:1,
    reward:12,
    endCheck:true
  }

];



let score =
  0;


let timeLeft =
  40;


let running =
  false;


let timer =
  null;


let spawnTimer =
  null;


let active =
  new Set();


let combo =
  0;


let lastHitAt =
  0;


let caughtThisGame =
  0;


let rareThisGame =
  0;


let mistakes =
  0;


let bossDefeated =
  0;


let mission =
  null;


let missionValue =
  0;


let missionDone =
  false;


let currentEvent =
  'normal';


let freezeUntil =
  0;


let bossSpawned =
  false;


let bestComboThisGame =
  0;


let rarestThisGame =
  '普通';


let rarestRank =
  0;



function loadState(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        )
        ||
        'null'
      );


    if(
      !saved
    ){

      return structuredClone(
        defaultState
      );

    }


    return {

      ...structuredClone(
        defaultState
      ),

      ...saved,

      collection:{

        ...defaultState.collection,

        ...(
          saved.collection
          ||
          {}
        )

      }

    };

  }

  catch{

    return structuredClone(
      defaultState
    );

  }

}



function saveState(){

function resetCombo(){

    0;

function updateComboUI(){

  comboText.textContent =
    `Combo ×${combo}`;


  comboFill.style.width =
    Math.min(
      100,
      combo * 6.7
    )
    +
    '%';


  arena.classList.toggle(
    'fever',
    combo >= 10
  );

}



function comboBonus(){

  if(
    combo > 0
    &&
    combo % 5 === 0
  ){

    const bonus =
      combo === 5
      ?
      2
      :
      combo === 10
      ?
      4
      :
      combo === 15
      ?
      6
      :
      8;


    score +=
      bonus;


    scoreEl.textContent =
      score;


    toast(
      `✨ ${combo} 连击奖励 +${bonus}`
    );


    return bonus;

  }


  return 0;

}



function updateMissionUI(){

  if(
    !mission
  ){

    missionText.textContent =
      '等待任务';


    missionProgress.textContent =
      '—';


    return;

  }


  missionText.textContent =
    missionDone
    ?
    `✅ ${mission.text}`
    :
    mission.text;



  if(
    mission.id === 'clean'
  ){

    missionProgress.textContent =
      missionDone
      ?
      `+${mission.reward}`
      :
      (
        mistakes === 0
        ?
        '保持中'
        :
        '失败'
      );

  }

  else{

    missionProgress.textContent =
      missionDone
      ?
      `+${mission.reward}`
      :
      `${Math.min(
        missionValue,
        mission.target
      )}/${mission.target}`;

  }

}



function checkMission(
  type
){

  if(
    !mission
    ||
    missionDone
  )
    return;



  if(
    mission.id === 'sand2'
    &&
    type === 'sand'
  ){

    missionValue++;

  }



  if(
    mission.id === 'rare3'
    &&
    [
      'sand',
      'rusty',
      'unknown'
    ].includes(type)
  ){

    missionValue++;

  }



  if(
    mission.id === 'combo8'
  ){

    missionValue =
      Math.max(
        missionValue,
        combo
      );

  }



  if(
    mission.id === 'catch18'
  ){

    missionValue =
      caughtThisGame;

  }



  if(
    mission.id === 'boss'
  ){

    missionValue =
      bossDefeated;

  }



  if(
    !mission.endCheck
    &&
    missionValue
    >=
    mission.target
  ){

    missionDone =
      true;


    score +=
      mission.reward;


    scoreEl.textContent =
      score;


    state.missions++;


    saveState();


    toast(
      `🎯 任务完成 +${mission.reward}`
    );

  }


  updateMissionUI();

}

        );

        );


        updateMissionUI();

      }



      else{

        combo =
          (
            now
            -
            lastHitAt
            <=
            2200
          )
          ?
          combo + 1
          :
          1;


        lastHitAt =
          now;



        bestComboThisGame =
          Math.max(
            bestComboThisGame,

          );


        state.bestCombo =

          );

        if(

        }



        if(
          type === 'unknown'

          );

        }



        makeFloat(
          x,
          y,
          `+${info.points}`
        );


        vibrate(

          ||
          info.legend
          ?
          35
          :
          15
        );


        checkMission(
          type
        );

      }



      el.style.animation =
        'hit .2s ease-in forwards';


      setTimeout(
        () => el.remove(),
        210
      );

    }
  );

    spawnTimer

    !running

    return;

    currentEvent === 'party'
  ){

    delay =
      560;

  }



  if(
    timeLeft <= 8
  ){

    delay =
      Math.min(
        delay,
        620
      );

  }



  spawnTimer =
    setTimeout(
      () => {

        spawn();



        if(
          currentEvent === 'party'
          &&
          Math.random()
          <
          .45
        ){

          setTimeout(
            () => spawn(),
            230
          );

        }



        if(
          currentEvent === 'rare'
          &&
          Math.random()
          <
          .32
        ){

          setTimeout(
            () => spawn(),
            260
          );

        }



        scheduleSpawn();

      },
      delay
    );

}

    40;


  combo =
    0;


  lastHitAt =
    0;


  caughtThisGame =
    0;


  rareThisGame =
    0;


  mistakes =
    0;


  bossDefeated =
    0;


  currentEvent =
    'normal';


  freezeUntil =
    0;


  bossSpawned =
    false;


  bestComboThisGame =
    0;


  rarestThisGame =
    '普通';


  rarestRank =
    0;



  scoreEl.textContent =
    0;


  timeEl.textContent =
    40;


  updateComboUI();


  chooseMission();


  clearTargets();


  overlay.style.display =
    'none';


  running =
    true;



  spawn();


  setTimeout(
    () => spawn(),
    340
  );

  timer =
    setInterval(
      () => {

        timeLeft--;


        timeEl.textContent =
          timeLeft;



        if(
          combo > 0

          performance.now()
          -

          timeLeft === 22

        ){

          bossSpawned =
            true;


          spawn(
            'boss'
          );


          showEvent(
            '👑 Boss 猫出现！'
          );

        }



        if(
          timeLeft === 8
        ){

          triggerFinalEvent();

        }



        if(
          timeLeft <= 0
        ){

          endGame();

        }

      },
      1000
    );

}



function endGame(){

  if(
    !running
  )
    return;


  running =
    false;


  clearInterval(
    timer
  );


  clearTimeout(
    spawnTimer
  );


  clearTargets();


  arena.classList.remove(
    'fever'
  );



  if(
    mission
    &&
    mission.id === 'clean'
    &&
    !missionDone
    &&
    mistakes === 0
  ){

    missionDone =
      true;


    missionValue =
      1;


    score +=
      mission.reward;


    state.missions++;


    toast(
      `🎯 任务完成 +${mission.reward}`
    );

  }



  resetCombo();


  scoreEl.textContent =
    score;


  state.games++;


  state.highScore =
    Math.max(
      state.highScore,
      score
    );


  highScoreEl.textContent =
    state.highScore;


  saveState();


  updateMissionUI();


  showEnd();

}



function titleForScore(
  s
){

  if(
    s >= 170
  )
    return '猫猫研究所所长';


  if(
    s >= 135
  )
    return '传说目击记录员';


  if(
    s >= 105
  )
    return '锈斑豹猫研究员';


  if(
    s >= 75
  )
    return '沙丘猫追踪员';


  if(
    s >= 45
  )
    return '咪咪诱捕专家';


  return '猫猫实习生';

}

function showCatbook(){

  const meta = [

    [
      'black',
      '🐈‍⬛',
      '黑咪',
      '少见'
    ],

    [
      'aby',
      '🐈',
      '阿比西尼亚',
      '少见'
    ],

    [
      'sand',
      '🏜️🐈',
      '沙丘猫',
      '稀有'
    ],

    [
      'rusty',
      '🐆',
      '锈斑豹猫',
      '稀有'
    ],

    [
      'unknown',
      '🐆✨',
      '未知豹纹米米',
      '传说'
    ]

  ];



  const cards =
    meta
      .map(
        (
          [
            key,
            emoji,
            name,
            rarity
          ]
        ) => {

          const n =
            state.collection[
              key
            ]
            ||
            0;


          const locked =
            n === 0;



          return `
          <div class="catcard ${locked ? 'locked' : ''}">

            <div class="catface">
              ${locked ? '❔' : emoji}
            </div>

            <div>

              <div class="catname">
                ${locked ? '？？？' : name}
              </div>

              <div class="catmeta">
                ${
                  locked
                  ?
                  '尚未留下有效目击记录'
                  :
                  rarity + ' · 已登记'
                }
              </div>

            </div>

            <div class="count">
              ${
                locked
                ?
                '未解锁'
                :
                `×${n}`
              }
            </div>

          </div>
          `;

        }
      )
      .join('');



  panel.innerHTML =
    `
    <div class="hero">
      📖
    </div>

    <h1>
      猫咪图鉴
    </h1>

    <p>
      抓到之后会永久登记。
      隐藏米米不是每局都会出现。😶
    </p>

    <div class="catbook">
      ${cards}
    </div>

    <button
      class="btn secondary"
      id="backBtn">
      返回研究所
    </button>
    `;



  overlay.style.display =
    'grid';


  $('backBtn').onclick =
    showMainMenu;

}
