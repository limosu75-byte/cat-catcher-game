<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>千万别按 · Ariki's Game Room</title>
<style>

:root{
  --bg1:#fff8f1;--bg2:#ffe7d9;--ink:#241c18;--muted:#7a6a62;
  --accent:#ff7b59;--accent2:#ffb26a;--card:rgba(255,255,255,.86);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--ink)}
body{
  background:
    radial-gradient(circle at 18% 0%,rgba(255,255,255,.95),transparent 24%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
}
button,a{font:inherit}
a{text-decoration:none;color:inherit}
.shell{max-width:760px;margin:auto;padding:max(env(safe-area-inset-top),16px) 16px max(env(safe-area-inset-bottom),24px)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.back{font-weight:900;color:var(--muted);font-size:14px}
.badge{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.7);font-size:12px;font-weight:900}
.card{
  background:var(--card);border:1px solid rgba(255,255,255,.94);border-radius:26px;
  box-shadow:0 18px 50px rgba(105,61,36,.12);backdrop-filter:blur(10px)
}
.btn{
  border:0;border-radius:18px;padding:13px 18px;font-weight:950;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 24px rgba(255,123,89,.22)
}
.btn.secondary{background:#fff4e9;color:var(--ink);box-shadow:none;border:1px solid #ffe0c7}
.muted{color:var(--muted)}

body{min-height:100vh;overflow:hidden}
.stage{
  height:72vh;min-height:480px;position:relative;overflow:hidden;padding:20px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center
}
h1{font-size:30px;margin:0 0 8px}
.warning{color:var(--muted);font-size:14px;line-height:1.6;max-width:340px}
#danger{
  width:150px;height:150px;border-radius:50%;border:0;margin-top:28px;color:white;font-size:20px;font-weight:1000;
  background:radial-gradient(circle at 35% 30%,#ff8b7c,#ea3e32 62%,#ba221b);
  box-shadow:0 14px 0 #a62620,0 22px 38px rgba(180,42,34,.28);transition:.12s;position:relative;z-index:2
}
#danger:active{transform:translateY(7px);box-shadow:0 7px 0 #a62620,0 15px 26px rgba(180,42,34,.25)}
#speech{margin-top:28px;min-height:48px;font-weight:900;font-size:16px}
#counter{position:absolute;top:14px;right:16px;font-weight:950;color:var(--muted)}
.cat{position:absolute;font-size:36px;pointer-events:none;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><a class="back" href="index.html">← 游戏大厅</a><div class="badge">😈 坑人</div></div>
  <div class="stage card" id="stage">
    <div id="counter">0 次</div>
    <h1 id="title">千万别按</h1>
    <div class="warning" id="warning">这个按钮没有任何值得按的理由。请保持理智。</div>
    <button id="danger">不要按</button>
    <div id="speech">😶 我看着你。</div>
  </div>
</div>
<script>
const danger=document.getElementById('danger'),speech=document.getElementById('speech'),counter=document.getElementById('counter'),stage=document.getElementById('stage'),warning=document.getElementById('warning'),title=document.getElementById('title');
let n=0,state={max:0};try{state=JSON.parse(localStorage.getItem('dontClickV1')||'null')||state}catch{}
const lines=[
  '你按了。😐','我都写了“不要按”。','第二次也是故意的是吧。','😾 手拿开。','你是不是把警告当教程看？',
  '好。现在开始记录案底。','猫猫研究所已经收到通知。','别按了，真的。','……你还来？','我开始怀疑按钮在控制你。',
  '第十次。你已经没有解释空间了。','🐈 有猫来看热闹了。','现在出去还来得及。','没有奖励。真的没有。','你到底想按到多少？',
  '🙄','😶🫵','算了。随你。','按钮：救命。','恭喜，你成功把一个简单页面按疯了。'
];
function spawnCat(){
  const c=document.createElement('div');c.className='cat';c.textContent=['🐈','🐈‍⬛','🐆','😾','🙀'][Math.floor(Math.random()*5)];
  c.style.left=(5+Math.random()*85)+'%';c.style.top=(12+Math.random()*75)+'%';stage.appendChild(c);setTimeout(()=>c.remove(),3200)
}
danger.onclick=()=>{
  n++;counter.textContent=n+' 次';speech.textContent=lines[Math.min(n-1,lines.length-1)];
  if(n>state.max){state.max=n;localStorage.setItem('dontClickV1',JSON.stringify(state))}
  if(n===5)warning.textContent='状态：用户完全没有听劝。';
  if(n===8){danger.textContent='真的别按';danger.style.transform='scale(.88)'}
  if(n===10)spawnCat();
  if(n>10&&n%2===0)spawnCat();
  if(n===12){danger.style.position='absolute';danger.style.left='18px';danger.style.bottom='24px'}
  if(n>=13){
    danger.style.left=(8+Math.random()*62)+'%';
    danger.style.bottom=(8+Math.random()*45)+'%';
  }
  if(n===16)title.textContent='《用户为什么不听话》';
  if(n===20){warning.textContent='实验结论：按钮没有问题。';danger.textContent='你赢了？'}
};
</script>
</body>
</html>
