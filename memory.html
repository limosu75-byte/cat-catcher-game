<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>猫猫翻牌 · Ariki's Game Room</title>
<style>

:root{
  --bg1:#fff8f1;--bg2:#ffe7d9;--ink:#241c18;--muted:#7a6a62;
  --accent:#ff7b59;--accent2:#ffb26a;--card:rgba(255,255,255,.86);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--ink)}
body{
  background:
    radial-gradient(circle at 18% 0%,rgba(255,255,255,.95),transparent 24%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
}
button,a{font:inherit}
a{text-decoration:none;color:inherit}
.shell{max-width:760px;margin:auto;padding:max(env(safe-area-inset-top),16px) 16px max(env(safe-area-inset-bottom),24px)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.back{font-weight:900;color:var(--muted);font-size:14px}
.badge{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.7);font-size:12px;font-weight:900}
.card{
  background:var(--card);border:1px solid rgba(255,255,255,.94);border-radius:26px;
  box-shadow:0 18px 50px rgba(105,61,36,.12);backdrop-filter:blur(10px)
}
.btn{
  border:0;border-radius:18px;padding:13px 18px;font-weight:950;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 24px rgba(255,123,89,.22)
}
.btn.secondary{background:#fff4e9;color:var(--ink);box-shadow:none;border:1px solid #ffe0c7}
.muted{color:var(--muted)}

h1{font-size:28px;margin:4px 0 2px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.hud div{text-align:center;padding:10px;background:rgba(255,255,255,.72);border-radius:17px;font-weight:900}
.hud small{display:block;font-size:10px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.tile{
  aspect-ratio:1;border:0;border-radius:18px;background:linear-gradient(145deg,#fff7ef,#ffe4cf);
  box-shadow:0 8px 18px rgba(95,56,34,.09);font-size:0;font-weight:900;transition:.16s;position:relative
}
.tile::after{content:"?";font-size:26px;color:#b88b70}
.tile.open,.tile.matched{background:#fff;font-size:32px;transform:scale(.97)}
.tile.open::after,.tile.matched::after{content:""}
.tile.matched{box-shadow:0 0 0 2px rgba(255,174,94,.35),0 8px 18px rgba(95,56,34,.09)}
.bottom{padding:14px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><a class="back" href="index.html">← 游戏大厅</a><div class="badge">🧠 记忆</div></div>
  <h1>猫猫翻牌</h1><p class="muted">8 对图案。尽量少翻、尽量快。😶</p>
  <div class="hud">
    <div><small>步数</small><span id="moves">0</span></div>
    <div><small>时间</small><span id="time">0</span>s</div>
    <div><small>最佳</small><span id="best">—</span></div>
  </div>
  <div class="board card" id="board"></div>
  <div class="bottom card"><div id="status">第一张牌等你翻。</div><button class="btn" id="restart" style="margin-top:10px">重新洗牌</button></div>
</div>
<script>
const icons=['🐈','🐈‍⬛','🐆','🦁','🐯','🐱','😺','😼'];
let deck=[],first=null,lock=false,moves=0,matched=0,started=false,startTime=0,timer=null;
let state={bestMoves:null,bestTime:null};try{state=JSON.parse(localStorage.getItem('memoryGameV1')||'null')||state}catch{}
const board=document.getElementById('board'),movesEl=document.getElementById('moves'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),status=document.getElementById('status');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderBest(){bestEl.textContent=state.bestMoves?state.bestMoves+'步':'—'}
function startTimer(){if(started)return;started=true;startTime=Date.now();timer=setInterval(()=>timeEl.textContent=Math.floor((Date.now()-startTime)/1000),1000)}
function newGame(){
  clearInterval(timer);deck=shuffle([...icons,...icons].map((icon,i)=>({icon,id:i,matched:false})));
  first=null;lock=false;moves=0;matched=0;started=false;movesEl.textContent='0';timeEl.textContent='0';status.textContent='第一张牌等你翻。';board.innerHTML='';renderBest();
  deck.forEach((card,idx)=>{const b=document.createElement('button');b.className='tile';b.dataset.i=idx;b.textContent=card.icon;b.onclick=()=>flip(b,idx);board.appendChild(b)})
}
function flip(btn,idx){
  if(lock||deck[idx].matched||btn.classList.contains('open'))return;startTimer();btn.classList.add('open');
  if(first===null){first={btn,idx};return}
  moves++;movesEl.textContent=moves;
  const a=deck[first.idx],b=deck[idx];
  if(a.icon===b.icon){
    a.matched=b.matched=true;first.btn.classList.add('matched');btn.classList.add('matched');first=null;matched+=2;status.textContent='配对成功 😋';
    if(matched===deck.length){
      clearInterval(timer);const sec=Math.floor((Date.now()-startTime)/1000);status.textContent=`完成！${moves} 步 · ${sec} 秒`;
      if(!state.bestMoves||moves<state.bestMoves||(moves===state.bestMoves&&sec<(state.bestTime||9999))){state.bestMoves=moves;state.bestTime=sec;localStorage.setItem('memoryGameV1',JSON.stringify(state));renderBest()}
    }
  }else{
    lock=true;status.textContent='不对，再记一下。';
    const old=first;first=null;setTimeout(()=>{old.btn.classList.remove('open');btn.classList.remove('open');lock=false},650)
  }
}
document.getElementById('restart').onclick=newGame;newGame();
</script>
</body>
</html>
